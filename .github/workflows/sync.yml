name: ON.com -> Full Size Run sync

on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours (UTC). GitHub may start scheduled runs a few minutes late.
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write            # commit the updated sync database back to the repo

concurrency:
  group: on-sync
  cancel-in-progress: false  # never run two syncs at once; queue instead

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run sync
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_STORE_DOMAIN: va9wah-fx.myshopify.com
        run: |
          node src/cli.ts unlock
          node src/cli.ts sync --trigger scheduler

      - name: Save sync database
        if: always()
        run: |
          node src/cli.ts checkpoint
          git config user.name "fsr-on-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/on-sync.sqlite
          git diff --cached --quiet || git commit -m "sync: update database [skip ci]"
          git push

      - name: Keep run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_number }}
          path: logs/*.report.*
          retention-days: 30
